    <text x="524" y="196" fill="#0e0e0d" font-size="26" font-weight="600" letter-spacing="0.01em">LUIS ALEJANDRO</text>
    <text x="524" y="242" fill="#65655f" font-size="19" letter-spacing="-0.005em">Martínez Faneyth</text>

    <text x="524" y="344" fill="#0e0e0d" font-size="62" font-weight="700" letter-spacing="-0.035em">Full-stack AI</text>
    <text x="524" y="410" fill="#0e0e0d" font-size="62" font-weight="700" letter-spacing="-0.035em">engineer.</text>

    <text x="524" y="466" fill="#65655f" font-size="22" letter-spacing="-0.005em">Building products and agents that stay</text>
    <text x="524" y="496" fill="#65655f" font-size="22" letter-spacing="-0.005em">dependable after launch.</text>
  </g>

  <!-- Accent rule and the one thing it points at -->
  <rect x="524" y="268" width="44" height="4" fill="#d61f3a"/>
  <g font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="0.08em" fill="#65655f">
