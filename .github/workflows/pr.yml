name: Pull Request

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
    branches:
      - develop

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Filter
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
      sphinx: ${{ steps.filter.outputs.sphinx }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          is_docs_path() {
            local f="$1"
            [[ "$f" == README.md || "$f" == README.rst ]] && return 0
            [[ "$f" =~ ^LICENSE ]] && return 0
            [[ "$f" =~ ^(HISTORY|CHANGELOG) ]] && return 0
            [[ "$f" == docs || "$f" =~ ^docs/ ]] && return 0
            [[ "$f" =~ ^\.github/ISSUE_TEMPLATE(/|$) ]] && return 0
            [[ "$f" == ".github/PULL_REQUEST_TEMPLATE.md" ]] && return 0
            return 1
          }
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${HEAD_SHA}"
          fi
          files="$(git diff --name-status "${BASE_SHA}...${HEAD_SHA}" || true)"
          run=false
          sphinx=false
          if [ -z "${files}" ]; then
            run=true
          else
            while IFS=$'\t' read -r status p1 p2; do
              [ -z "${status}" ] && continue
              for f in "${p1}" "${p2}"; do
                [ -z "${f}" ] && continue
                [[ "$f" == docs || "$f" =~ ^docs/ ]] && sphinx=true
                if is_docs_path "${f}"; then
                  continue
                fi
                run=true
                break 2
              done
            done <<< "${files}"
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "sphinx=${sphinx}" >> "${GITHUB_OUTPUT}"
  build:
    name: Build
    needs: [filter]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Restore npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */node_modules
            */*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Ensure npm cache dir exists
        run: mkdir -p ~/.npm

      - name: Set environment variables
        run: |
          echo "UID=$(id -u)" >> $GITHUB_ENV
          echo "GID=$(id -g)" >> $GITHUB_ENV
          echo "PROJECT_NAME=luisalejandro-org" >> $GITHUB_ENV
          echo "COSMIC_READ_KEY=${{ secrets.COSMIC_READ_KEY }}" >> .env
          echo "COSMIC_BUCKET_SLUG=${{ secrets.COSMIC_BUCKET_SLUG }}" >> .env

      - name: Build Docker image
        run: make image

      - name: Install dependencies
        run: make dependencies

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Build production artifacts
        run: make build

      - name: Tear down Docker
        if: always()
        run: make down

  build-skip:
    name: Build
    needs: [filter]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Skip docs-only changes
        run: echo "Docs-only PR; skipping expensive checks."

  code-quality:
    name: Code Quality
    needs: [filter]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Semgrep scan
        run: |
          BASELINE="${{ github.event.pull_request.base.sha }}"
          semgrep scan \
            --config p/ci \
            --config p/javascript \
            --baseline-commit "${BASELINE}" \
            --metrics=off \
            --error

  code-quality-skip:
    name: Code Quality
    needs: [filter]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Skip docs-only changes
        run: echo "Docs-only PR; skipping expensive checks."
