version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: monthly
    day: tuesday
    time: "01:00"
  cooldown:
    default-days: 14
  ignore:
    # typescript-eslint still requires typescript <6.1.0. Unfreeze when ESLint
    # supports TypeScript 7.
    - dependency-name: "typescript"
    - dependency-name: "@typescript/native"

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
    day: tuesday
    time: "01:00"
  cooldown:
    default-days: 14
